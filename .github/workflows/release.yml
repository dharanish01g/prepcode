# Builds prepcode for Windows, macOS (Apple Silicon + Intel) and Linux, and
# attaches the installers to a draft GitHub Release for review before publishing.
#
# Release: bump "version" in app/src-tauri/tauri.conf.json (and app/package.json),
# then push a matching tag, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
# It can also be started by hand from the Actions tab (workflow_dispatch).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write # create the release and upload installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows
            platform: windows-latest
            target: x86_64-pc-windows-msvc

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: prepcode v__VERSION__
          releaseBody: |
            Download the installer for your computer:
            - **Windows:** `.msi` or `-setup.exe`
            - **macOS (Apple Silicon, M1 and newer):** `aarch64.dmg`
            - **macOS (Intel):** `x64.dmg`
            - **Linux:** `.AppImage`, `.deb` or `.rpm`
          releaseDraft: true
          prerelease: false
