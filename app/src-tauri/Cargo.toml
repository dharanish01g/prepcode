[package]
name = "app"
version = "0.0.11"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
sha2 = "0.11.0"
hex = "0.4.3"
tar = "0.4.46"
flate2 = "1.1.10"
zip = "8.6.0"
xz2 = { version = "0.1.7", features = ["static"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "system-proxy", "http2", "json"] }
tauri-plugin-updater = "2.13.1"
tauri-plugin-process = "2.4.0"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4.2.0"
sha1 = "0.11.0"
base64 = "0.23.1"
tauri-plugin-single-instance = "2"

# Stopping a program kills its whole process group (see run.rs).
[target."cfg(unix)".dependencies]
libc = "0.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
